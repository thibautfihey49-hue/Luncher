name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Clean
        run: |
          chmod +x gradlew
         ./gradlew clean --no-daemon --no-build-cache
      - name: Build APK
        run:./gradlew assembleDebug --no-daemon --no-build-cache --refresh-dependencies
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Luncher-debug-apk
          path: app/build/outputs/apk/debug/*.apk
